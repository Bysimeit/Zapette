name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for the release"
        type: choice
        options: [major, minor, patch]
        default: major

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Compute version
        id: version
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$last" ]; then
            last="v$(grep -oP 'ZAPETTE_VERSION_NAME"\) \?: "\K[0-9.]+' app/build.gradle.kts)"
          fi
          IFS=. read -r major minor patch <<< "${last#v}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            name="$major.$minor.$patch"
            prerelease=false
          else
            name="$major.$minor.$patch-dev.${{ github.run_number }}"
            prerelease=true
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version: $name (prerelease: $prerelease)"

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAPETTE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ZAPETTE_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key and cannot update a previous install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zapette.jks"
          echo "ZAPETTE_STORE_FILE=$RUNNER_TEMP/zapette.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          ZAPETTE_VERSION_NAME: ${{ steps.version.outputs.name }}
          ZAPETTE_VERSION_CODE: ${{ github.run_number }}
          ZAPETTE_STORE_PASSWORD: ${{ secrets.ZAPETTE_STORE_PASSWORD }}
          ZAPETTE_KEY_ALIAS: ${{ secrets.ZAPETTE_KEY_ALIAS }}
          ZAPETTE_KEY_PASSWORD: ${{ secrets.ZAPETTE_KEY_PASSWORD }}
        run: |
          ./gradlew test assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Zapette-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Zapette-${{ steps.version.outputs.name }}
          path: Zapette-${{ steps.version.outputs.name }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          apk="Zapette-${{ steps.version.outputs.name }}.apk"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "$tag" --prerelease \
              --notes "Development build of ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Zapette ${{ steps.version.outputs.name }}" \
              --generate-notes --latest
          fi
